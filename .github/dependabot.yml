# MADDE 680 / 682: Python paketlerinde YALNIZ GÜVENLİK güncellemeleri (open-pull-requests-limit: 0 = sürüm yükseltme PR'ı açılmaz;
# güvenlik PR'ları yine açılır — depo ayarlarında "Dependabot security updates" açık olmalı). Sebep: bot requirements.lock ile
# BİREBİR sabit sürümlerle kurulur; requirements.txt'deki alt sınırı yükseltmek hiçbir şey değiştirmez, sürüm yükseltmek ise canlı
# öncesi gereksiz risk. Güvenlik PR'ı gelince lock yeniden üretilir (uv pip compile ... --generate-hashes; madde 663) ve testler koşar.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
