# MADDE 680: kod denetimi (ruff). Yalnız GERÇEK HATA sınıfları: tanımsız ad, sözdizimi, yanlış karşılaştırma, gölgelenmiş tanım.
# Canlı bot dosyalarında sıfır bulgu bekleniyor (CI'da zorunlu). Araştırma betikleri (arastirma_*, g*.py) denetlenmez.
target-version = "py312"
